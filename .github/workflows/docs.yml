name: Generate API Documentation

on:
  push:
    branches: [ main ]

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pydoc-markdown
          pip install -e .

      - name: Generate API Docs
        run: |
          mkdir -p docs/api
          PYTHONPATH=. pydoc-markdown -I . -m app.services.analyzer_service > docs/api/analyzer_service.md
          PYTHONPATH=. pydoc-markdown -I . -m app.services.fit_service > docs/api/fit_service.md
          PYTHONPATH=. pydoc-markdown -I . -m app.services.indexing_service > docs/api/indexing_service.md
          PYTHONPATH=. pydoc-markdown -I . -m app.services.linkedin_service > docs/api/linkedin_service.md
          PYTHONPATH=. pydoc-markdown -I . -m app.services.llm_service > docs/api/llm_service.md
          PYTHONPATH=. pydoc-markdown -I . -m app.services.matching_service > docs/api/matching_service.md
          PYTHONPATH=. pydoc-markdown -I . -m app.services.scraper_service > docs/api/scraper_service.md
          PYTHONPATH=. pydoc-markdown -I . -m app.utils.db_manager > docs/api/db_manager.md
          PYTHONPATH=. pydoc-markdown -I . -m app.utils.vector_store > docs/api/vector_store.md

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api
          git commit -m "docs: auto-generate api documentation" || exit 0
          git push
