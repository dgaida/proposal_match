name: Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git-cliff and mike

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mkdocs-material mkdocstrings[python] mkdocs-mermaid2-plugin mkdocs-static-i18n interrogate git-cliff mike
          pip install -e .

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Check API Doc Coverage
        run: |
          interrogate -vv app/
          mkdir -p docs/assets
          interrogate --generate-badge docs/assets/interrogate_badge.svg app/

      - name: Generate Changelog
        run: |
          git-cliff --output CHANGELOG.md

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and Deploy Versioned Docs
        run: |
          # Fetch the current version from pyproject.toml
          VERSION=$(grep -oP 'version = "\K[^"]+' pyproject.toml)

          # Deploy with mike
          mike deploy --push --update-aliases $VERSION latest
          mike set-default --push latest

      - name: Commit Quality Artifacts
        run: |
          git add CHANGELOG.md docs/assets/interrogate_badge.svg
          git commit -m "docs: update changelog and quality metrics [skip ci]" || exit 0
          git pull --rebase origin main
          git push
