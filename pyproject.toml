[project]
name = "funding-research-app"
version = "0.1.4"
description = "A research funding analysis and collaboration matching tool."
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "llm-client",
    "streamlit",
    "beautifulsoup4",
    "httpx",
    "chromadb",
    "sqlalchemy",
    "pytest",
    "pydantic",
    "python-dotenv",
    "duckduckgo-search",
    "linkedin_api",
    "pydantic-settings"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
